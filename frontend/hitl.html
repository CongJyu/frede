<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frede — Human-in-the-Loop Evaluation</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <nav class="topnav">
    <span class="brand">🔍 Frede</span>
    <a href="/">Analyzer</a>
    <a href="/hitl.html" class="active">HITL Evaluation</a>
    <a href="/examples.html">Examples</a>
  </nav>

  <header class="page-head">
    <h1>🧑‍⚖️ Human-in-the-Loop Evaluation</h1>
    <p class="sub">
      Judge each review as <strong>Fake</strong> or <strong>Real</strong>.
      Pass 1 shows the raw text; pass 2 shows the <em>same</em> reviews with XAI
      highlights and reason codes — so you can measure whether explanations help.
    </p>
  </header>

  <div id="error-banner" class="banner error hidden"></div>

  <main class="container">
    <section id="review-panel" class="card hidden">
      <div class="row between">
        <h2 id="progress" style="margin:0;">Loading…</h2>
        <span id="mode-badge" class="badge badge-neutral">WITHOUT XAI</span>
      </div>
      <p id="review-text" class="review-text"></p>
      <div id="xai-box" class="hidden" style="margin-top:14px;">
        <h3>XAI explanation</h3>
        <div id="highlighted"></div>
        <div id="reason-codes" style="margin-top:12px;"></div>
      </div>
    </section>

    <section id="controls" class="card hidden">
      <div class="row">
        <label for="judgment" style="margin:0;">Your judgment:
          <select id="judgment" style="padding:6px;">
            <option value="Real">Real</option>
            <option value="Fake">Fake</option>
          </select>
        </label>
        <label for="confidence" style="margin:0;">
          Confidence (1–5):
          <input type="range" id="confidence" min="1" max="5" step="1" value="3">
          <span id="confidence-val">3</span>
        </label>
      </div>
      <label for="feedback">Feedback (optional)</label>
      <input type="text" id="feedback" placeholder="What influenced your decision?">
      <div class="row" style="margin-top:12px;">
        <button id="submit" class="btn primary">Submit &amp; Next</button>
        <span id="status" class="muted"></span>
      </div>
    </section>

    <section id="results-panel" class="hidden"></section>

    <div class="row" style="justify-content:flex-end;">
      <button id="reset" class="btn">↺ Reset session</button>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/hitl.js"></script>
</body>
</html>
