[project]
name = "frede"
version = "0.1.0"
description = "Fake Restaurant Review Detection + XAI — web app port of guided_study.ipynb"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "torch>=2.9",
    "transformers>=4.50",
    "numpy>=2.1",
    "scikit-learn>=1.6",
    "scipy>=1.13",
    "pandas>=2.2",
    "lime>=0.2.0",
    "captum>=0.7",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dataset = ["datasets>=3.0"]
shap = ["shap>=0.46", "numba"]
all = ["datasets>=3.0", "shap>=0.46", "numba"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.routers", "app.services", "training", "scripts"]
